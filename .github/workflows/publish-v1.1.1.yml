name: Publish v1.1.1
on:
  push:
    branches: [publish/v1.1.1]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8d3c9803a3749c1f1413c33a4bfab30d9eaf3925
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew assembleRelease --no-daemon --stacktrace
      - run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/HyundaiBlueLinkTasker-v1.1.1-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HyundaiBlueLinkTasker-v1.1.1-release
          path: app/build/outputs/apk/release/HyundaiBlueLinkTasker-v1.1.1-release.apk
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HyundaiBlueLinkTasker-v1.1.1-release
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Tasker remote start now accepts one `start_options` JSON extra for climate settings. Missing or invalid settings use saved defaults, and existing Tasker extras continue to work.

          Download `HyundaiBlueLinkTasker-v1.1.1-release.apk` under Assets. If Android reports a signing conflict with an older installation, uninstall the older app first. Uninstalling clears its local settings and Tasker secret.
          EOF
          gh release create v1.1.1 HyundaiBlueLinkTasker-v1.1.1-release.apk \
            --repo GitUpGitUp/hyundai-blink-tasker \
            --target 8d3c9803a3749c1f1413c33a4bfab30d9eaf3925 \
            --title "v1.1.1 – Tasker remote-start options" --notes-file release-notes.md
